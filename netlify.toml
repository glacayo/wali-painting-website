[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "img-src 'self' https://metrics.walipaintinghandyman.com https://www.googletagmanager.com https://www.facebook.com data:; connect-src 'self' https://metrics.walipaintinghandyman.com https://*.google-analytics.com https://*.analytics.google.com https://www.facebook.com; frame-src https://metrics.walipaintinghandyman.com https://www.google.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://fonts.googleapis.com https://connect.facebook.net https://capi-automation.s3.us-east-2.amazonaws.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com"
