[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "img-src https://metrics.walipaintinghandyman.com https://www.googletagmanager.com data:; connect-src https://metrics.walipaintinghandyman.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://metrics.walipaintinghandyman.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com"
